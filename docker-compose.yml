# Local development stack: Postgres, the sandbox image, the local Hardhat chain, API and frontend.
# Ports are bound to 127.0.0.1 so nothing is exposed beyond the dev machine.
services:
  postgres:
    # Digest-pinned (audit finding M6). Update tag and digest together.
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provenancex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provenancex}
      POSTGRES_DB: ${POSTGRES_DB:-provenancex}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Build-only service: docker compose --profile sandbox-image build sandbox-image
  sandbox-image:
    build: ./docker/sandbox
    image: provenancex-sandbox:0.1.0
    profiles: ["sandbox-image"]

  # Build-only service: docker compose --profile analyzer-image build analyzer-image
  # Every step that reads untrusted artifact content runs in a container from this image.
  analyzer-image:
    build:
      context: ./backend
      dockerfile: ../docker/analyzer/Dockerfile
    image: provenancex-analyzer:0.1.0
    profiles: ["analyzer-image"]

  # Build-only service: docker compose --profile fetcher-image build fetcher-image
  # GitHub and Hugging Face downloads run only in containers from this image (Milestone B).
  fetcher-image:
    build:
      context: ./backend
      dockerfile: ../docker/fetcher/Dockerfile
    image: ${FETCHER_IMAGE:-provenancex-fetcher:0.1.0}
    profiles: ["fetcher-image"]

  # The only way out of the internal fetch network (docs/security/fetcher.md). HTTPS CONNECT
  # only, to an exact host allowlist on port 443, after DNS + public-IP checks; connections are
  # pinned to the validated address. It sits on the fetch network (internal: no route out) and
  # its own egress network, never on the default network with Postgres, the API or the chain.
  egress-proxy:
    build:
      context: ./backend
      dockerfile: ../docker/egress-proxy/Dockerfile
    image: provenancex-egress-proxy:0.1.0
    environment:
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-github.com,huggingface.co,us.aws.cdn.hf.co,cas-bridge.xethub.hf.co}
      EGRESS_ALLOWED_PORTS: "443"
      EGRESS_CONNECT_TIMEOUT_SECONDS: ${EGRESS_CONNECT_TIMEOUT_SECONDS:-10}
      EGRESS_IDLE_TIMEOUT_SECONDS: ${EGRESS_IDLE_TIMEOUT_SECONDS:-60}
      EGRESS_MAX_TUNNEL_SECONDS: ${EGRESS_MAX_TUNNEL_SECONDS:-900}
      EGRESS_MAX_TUNNEL_MB: ${EGRESS_MAX_TUNNEL_MB:-512}
      EGRESS_MAX_CONNECTIONS: ${EGRESS_MAX_CONNECTIONS:-32}
    networks:
      fetch:
        aliases: ["egress-proxy"]
      egress: {}
    read_only: true
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-B", "-m", "app.egress_proxy", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local chain only, bound to loopback. It runs in memory, so a restart erases every anchor.
  hardhat:
    build: ./contracts
    image: provenancex-hardhat:0.1.0
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${BLOCKCHAIN_HOST_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>r.json()).then(j=>process.exit(j.result==='0x7a69'?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot deploy: docker compose --profile chain-deploy run --rm hardhat-deploy
  # The key comes only from the git-ignored .env.
  hardhat-deploy:
    image: provenancex-hardhat:0.1.0
    profiles: ["chain-deploy"]
    # --no-compile: the image is compiled at build time and this container is read-only.
    command: ["npx", "hardhat", "run", "--no-compile", "scripts/deploy.js", "--network", "provenancex"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
    depends_on:
      hardhat:
        condition: service_healthy

  # Queues scans and serves results. It has no Docker socket and no Docker CLI, and it never
  # reads artifact content (that happens only in analyzer containers launched by scan-runner).
  api:
    build:
      context: ./backend
      target: api
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-provenancex}:${POSTGRES_PASSWORD:-provenancex}@postgres:5432/${POSTGRES_DB:-provenancex}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCANNER_VERSION: ${SCANNER_VERSION:-0.1.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_ARTIFACT_SIZE_MB: ${MAX_ARTIFACT_SIZE_MB:-200}
      MAX_ARTIFACT_FILES: ${MAX_ARTIFACT_FILES:-20000}
      WORKSPACE_ROOT: /app/workspace
      SBOM_PROVIDER: ${SBOM_PROVIDER:-syft}
      VULN_PROVIDER: ${VULN_PROVIDER:-osv}
      NVD_ENABLED: ${NVD_ENABLED:-true}
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_MAX_LOOKUPS: ${NVD_MAX_LOOKUPS:-10}
      HF_PROVIDER: ${HF_PROVIDER:-hf}
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-30}
      HF_DOWNLOAD_TIMEOUT_SECONDS: ${HF_DOWNLOAD_TIMEOUT_SECONDS:-600}
      HF_MAX_FILE_MB: ${HF_MAX_FILE_MB:-64}
      HF_MAX_FILES: ${HF_MAX_FILES:-2000}
      PICKLE_MAX_MB: ${PICKLE_MAX_MB:-64}
      PICKLE_MAX_OPCODES: ${PICKLE_MAX_OPCODES:-2000000}
      MODEL_CARD_MAX_KB: ${MODEL_CARD_MAX_KB:-256}
      STATIC_MAX_FILES: ${STATIC_MAX_FILES:-5000}
      STATIC_MAX_FILE_KB: ${STATIC_MAX_FILE_KB:-1024}
      STATIC_MAX_TOTAL_MB: ${STATIC_MAX_TOTAL_MB:-64}
      STATIC_MAX_FINDINGS: ${STATIC_MAX_FINDINGS:-500}
      STATIC_ARCHIVE_RATIO_WARN_FRACTION: ${STATIC_ARCHIVE_RATIO_WARN_FRACTION:-0.8}
      # Optional behavioral (dynamic) analysis. It is separate from the mandatory analyzer
      # sandbox below and stays off until it supports the named workspace volume.
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-disabled}
      APP_ENV: ${APP_ENV:-development}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_COMPRESSION_RATIO: ${MAX_COMPRESSION_RATIO:-100.0}
      GIT_CLONE_TIMEOUT_SECONDS: ${GIT_CLONE_TIMEOUT_SECONDS:-120}
      SYFT_PATH: ${SYFT_PATH:-syft}
      SYFT_TIMEOUT_SECONDS: ${SYFT_TIMEOUT_SECONDS:-300}
      MAX_SBOM_MB: ${MAX_SBOM_MB:-50}
      MAX_SBOM_COMPONENTS: ${MAX_SBOM_COMPONENTS:-50000}
      OSV_API_BASE: ${OSV_API_BASE:-https://api.osv.dev}
      OSV_TIMEOUT_SECONDS: ${OSV_TIMEOUT_SECONDS:-20.0}
      OSV_MAX_DETAIL_LOOKUPS: ${OSV_MAX_DETAIL_LOOKUPS:-500}
      NVD_API_BASE: ${NVD_API_BASE:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      NVD_TIMEOUT_SECONDS: ${NVD_TIMEOUT_SECONDS:-20.0}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-2}
      HTTP_MAX_RESPONSE_MB: ${HTTP_MAX_RESPONSE_MB:-10}
      SANDBOX_DOCKER_PATH: ${SANDBOX_DOCKER_PATH:-docker}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-provenancex-sandbox:0.1.0}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-60}
      SANDBOX_HOST_GRACE_SECONDS: ${SANDBOX_HOST_GRACE_SECONDS:-15}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-128}
      SANDBOX_TMP_MB: ${SANDBOX_TMP_MB:-64}
      SANDBOX_TRACE_TMP_MB: ${SANDBOX_TRACE_TMP_MB:-32}
      SANDBOX_MAX_STDERR_KB: ${SANDBOX_MAX_STDERR_KB:-1024}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
      SANDBOX_QUEUE_TIMEOUT_SECONDS: ${SANDBOX_QUEUE_TIMEOUT_SECONDS:-300}
      SANDBOX_MAX_TRACE_MB: ${SANDBOX_MAX_TRACE_MB:-16}
      SANDBOX_MAX_TRACE_LINES: ${SANDBOX_MAX_TRACE_LINES:-200000}
      SANDBOX_SPIKE_MEMORY_FRACTION: ${SANDBOX_SPIKE_MEMORY_FRACTION:-0.9}
      SANDBOX_SPIKE_PIDS_FRACTION: ${SANDBOX_SPIKE_PIDS_FRACTION:-0.9}
      SANDBOX_SPIKE_CPU_FRACTION: ${SANDBOX_SPIKE_CPU_FRACTION:-0.9}
      SANDBOX_SPIKE_CPU_MIN_INTERVALS: ${SANDBOX_SPIKE_CPU_MIN_INTERVALS:-3}
      # Fixed path inside the container: the host's ml/models, mounted read-only.
      MODEL_PATH: /app/ml/models
      BLOCKCHAIN_PROVIDER: ${BLOCKCHAIN_PROVIDER:-disabled}
      BLOCKCHAIN_ANCHOR_ON_SCAN: ${BLOCKCHAIN_ANCHOR_ON_SCAN:-false}
      BLOCKCHAIN_TIMEOUT_SECONDS: ${BLOCKCHAIN_TIMEOUT_SECONDS:-30}
      # Fixed: "localhost" from a copied .env would point at the API container itself.
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      # Sandbox-only content analysis (docs/security/sandbox.md). There is no disabled mode:
      # without Docker and the analyzer image, scans fail with sandbox_unavailable.
      ANALYZER_PROVIDER: docker
      ANALYZER_DOCKER_PATH: ${ANALYZER_DOCKER_PATH:-docker}
      ANALYZER_IMAGE: ${ANALYZER_IMAGE:-provenancex-analyzer:0.1.0}
      ANALYZER_TIMEOUT_SECONDS: ${ANALYZER_TIMEOUT_SECONDS:-600}
      ANALYZER_EXTRACT_TIMEOUT_SECONDS: ${ANALYZER_EXTRACT_TIMEOUT_SECONDS:-300}
      ANALYZER_HOST_GRACE_SECONDS: ${ANALYZER_HOST_GRACE_SECONDS:-15}
      ANALYZER_MEMORY_MB: ${ANALYZER_MEMORY_MB:-1536}
      ANALYZER_CPUS: ${ANALYZER_CPUS:-1.0}
      ANALYZER_PIDS_LIMIT: ${ANALYZER_PIDS_LIMIT:-128}
      ANALYZER_TMP_MB: ${ANALYZER_TMP_MB:-256}
      # Cap on the JSON envelope; the SBOM travels as its own frame (MAX_SBOM_MB) (audit M3).
      ANALYZER_MAX_OUTPUT_MB: ${ANALYZER_MAX_OUTPUT_MB:-12}
      ANALYZER_PERSIST_TIMEOUT_SECONDS: ${ANALYZER_PERSIST_TIMEOUT_SECONDS:-120}
      # The separate Syft container (audit M4): Syft's own timeout plus start-up.
      ANALYZER_SBOM_TIMEOUT_SECONDS: ${ANALYZER_SBOM_TIMEOUT_SECONDS:-360}
      ANALYZER_MAX_STDERR_KB: ${ANALYZER_MAX_STDERR_KB:-256}
      # Inside Compose the workspace is the named volume below, mounted into analyzer
      # containers with volume-subpath=<scan_id>/src.
      ANALYZER_WORKSPACE_MOUNT: volume
      ANALYZER_WORKSPACE_VOLUME: ${ANALYZER_WORKSPACE_VOLUME:-${COMPOSE_PROJECT_NAME}_workspace}
      # The API only queues; the scan-runner service runs scans.
      SCAN_DISPATCH: runner
      RUNNER_POLL_SECONDS: ${RUNNER_POLL_SECONDS:-2.0}
      # Claim ownership (docs/security/sandbox.md, "Runner crashes"): heartbeat interval, how
      # long a silent heartbeat takes to be declared stale, and the hard per-scan ceiling.
      RUNNER_HEARTBEAT_SECONDS: ${RUNNER_HEARTBEAT_SECONDS:-10}
      RUNNER_STALE_SECONDS: ${RUNNER_STALE_SECONDS:-120}
      RUNNER_MAX_SCAN_SECONDS: ${RUNNER_MAX_SCAN_SECONDS:-1800}
      RUNNER_RECONCILE_SECONDS: ${RUNNER_RECONCILE_SECONDS:-30}
      # Scopes orphan-container cleanup to this deployment (empty: the workspace volume name).
      ANALYZER_INSTANCE: ${ANALYZER_INSTANCE:-}
      ANALYZER_CPU_GRACE_SECONDS: ${ANALYZER_CPU_GRACE_SECONDS:-30}
      # Empty: the hostname, i.e. the container id, unique per replica. Only set it for a
      # single runner; replicas sharing an id would recover each other's claims.
      RUNNER_ID: ${RUNNER_ID:-}
      # Watchdog: a sandbox step this long past its deadline (or a scan past the ceiling) is
      # failed by the runner itself, and the runner exits so Compose restarts it.
      RUNNER_WATCHDOG_GRACE_SECONDS: ${RUNNER_WATCHDOG_GRACE_SECONDS:-60}
      RUNNER_WATCHDOG_EXIT_SECONDS: ${RUNNER_WATCHDOG_EXIT_SECONDS:-30}
      # Verification jobs (audit M5): POST /verify queues; the runner re-hashes in a read-only
      # rehash container. Past VERIFY_MAX_PENDING queued jobs the API answers 429.
      VERIFY_REHASH_TIMEOUT_SECONDS: ${VERIFY_REHASH_TIMEOUT_SECONDS:-300}
      VERIFY_MAX_SECONDS: ${VERIFY_MAX_SECONDS:-600}
      VERIFY_MAX_PENDING: ${VERIFY_MAX_PENDING:-50}
      # Kernel-capped staging (audit L1): one tmpfs volume of STAGING_MB per running scan, at
      # most STAGING_TOTAL_MB of them in RAM; a scan waits STAGING_WAIT_SECONDS for room.
      STAGING_MB: ${STAGING_MB:-512}
      STAGING_TOTAL_MB: ${STAGING_TOTAL_MB:-1536}
      STAGING_WAIT_SECONDS: ${STAGING_WAIT_SECONDS:-300}
      # Persistent workspace budget for kept trees (oldest finished scans are pruned first).
      WORKSPACE_MAX_TOTAL_MB: ${WORKSPACE_MAX_TOTAL_MB:-4096}
      # The untrusted SBOM is parsed in a child process with this address-space limit.
      SBOM_PARSE_MEMORY_MB: ${SBOM_PARSE_MEMORY_MB:-768}
      SBOM_PARSE_TIMEOUT_SECONDS: ${SBOM_PARSE_TIMEOUT_SECONDS:-120}
      # Isolated fetcher (audit H1): downloads run in per-scan fetcher containers on the
      # internal fetch network, behind the egress proxy. There is no host-side download.
      FETCHER_PROVIDER: docker
      FETCHER_IMAGE: ${FETCHER_IMAGE:-provenancex-fetcher:0.1.0}
      FETCHER_NETWORK: ${FETCHER_NETWORK:-${COMPOSE_PROJECT_NAME}_fetch}
      FETCHER_PROXY_URL: http://egress-proxy:3128
      FETCHER_MEMORY_MB: ${FETCHER_MEMORY_MB:-1024}
      FETCHER_CPUS: ${FETCHER_CPUS:-1.0}
      FETCHER_PIDS_LIMIT: ${FETCHER_PIDS_LIMIT:-64}
      FETCHER_TMP_MB: ${FETCHER_TMP_MB:-64}
      FETCHER_SETUP_SECONDS: ${FETCHER_SETUP_SECONDS:-30}
      FETCHER_HOST_GRACE_SECONDS: ${FETCHER_HOST_GRACE_SECONDS:-15}
      FETCHER_MAX_OUTPUT_MB: ${FETCHER_MAX_OUTPUT_MB:-8}
      FETCHER_MAX_CONCURRENT: ${FETCHER_MAX_CONCURRENT:-2}
      FETCHER_WAIT_SECONDS: ${FETCHER_WAIT_SECONDS:-300}
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-github.com,huggingface.co,us.aws.cdn.hf.co,cas-bridge.xethub.hf.co}
    volumes:
      - ./ml/models:/app/ml/models:ro
      # Off-chain evidence, kept so that verification can recompute hashes. A named volume, never
      # a host bind mount. Holds untrusted artifacts until `docker compose down -v`.
      - workspace:/app/workspace
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Claims queued scans and runs each content-reading step in a fresh analyzer container.
  # The ONLY service with the Docker socket. It has no published port and no HTTP server.
  # The socket is root-equivalent on the host: keep this service minimal (docs/security/sandbox.md).
  scan-runner:
    build:
      context: ./backend
      target: runner
    image: provenancex-runner:0.1.0
    command: ["python", "-m", "app.runner"]
    environment:
      <<: *backend-env
    volumes:
      - workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    # The group that owns the socket: `stat -c %g /var/run/docker.sock` (make up detects it).
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Bounds the runner itself (audit M3): it never parses large untrusted JSON in-process; the
    # SBOM is parsed in a child limited to SBOM_PARSE_MEMORY_MB.
    mem_limit: ${RUNNER_MEMORY_LIMIT:-1536m}
    memswap_limit: ${RUNNER_MEMORY_LIMIT:-1536m}
    pids_limit: 256
    # Come back after a crash: startup recovery then fails the interrupted scan, replaces its
    # claim and removes its analyzer containers. `docker compose stop` still stops it for good.
    restart: unless-stopped
    # On SIGTERM the runner finishes its current scan. Give it the per-scan ceiling
    # (RUNNER_MAX_SCAN_SECONDS, 30m) plus a minute; an idle runner exits at once. If it is
    # killed anyway, analyzer containers stop at their own deadline and are reconciled.
    stop_grace_period: ${RUNNER_STOP_GRACE_PERIOD:-31m}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

networks:
  # Internal: Docker gives it no route to the internet or to any other network. Fetcher
  # containers (attached by the runner) and the egress proxy are its only members.
  fetch:
    name: ${FETCHER_NETWORK:-${COMPOSE_PROJECT_NAME}_fetch}
    internal: true
  # The egress proxy's own way out. Nothing else is attached to it.
  egress:
    name: ${EGRESS_NETWORK:-${COMPOSE_PROJECT_NAME}_egress}

volumes:
  pgdata:
  # Explicitly named, because analyzer containers mount it by name (volume-subpath). The default
  # is per Compose project (audit finding L9), so two projects never share a workspace.
  workspace:
    name: ${ANALYZER_WORKSPACE_VOLUME:-${COMPOSE_PROJECT_NAME}_workspace}
