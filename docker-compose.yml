# Local development stack: Postgres, the sandbox image, the local Hardhat chain, API and frontend.
# Ports are bound to 127.0.0.1 so nothing is exposed beyond the dev machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provenancex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provenancex}
      POSTGRES_DB: ${POSTGRES_DB:-provenancex}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Build-only service: docker compose --profile sandbox-image build sandbox-image
  sandbox-image:
    build: ./docker/sandbox
    image: provenancex-sandbox:0.1.0
    profiles: ["sandbox-image"]

  # Local chain only, bound to loopback. It runs in memory, so a restart erases every anchor.
  hardhat:
    build: ./contracts
    image: provenancex-hardhat:0.1.0
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${BLOCKCHAIN_HOST_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>r.json()).then(j=>process.exit(j.result==='0x7a69'?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot deploy: docker compose --profile chain-deploy run --rm hardhat-deploy
  # The key comes only from the git-ignored .env.
  hardhat-deploy:
    image: provenancex-hardhat:0.1.0
    profiles: ["chain-deploy"]
    # --no-compile: the image is compiled at build time and this container is read-only.
    command: ["npx", "hardhat", "run", "--no-compile", "scripts/deploy.js", "--network", "provenancex"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
    depends_on:
      hardhat:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-provenancex}:${POSTGRES_PASSWORD:-provenancex}@postgres:5432/${POSTGRES_DB:-provenancex}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCANNER_VERSION: ${SCANNER_VERSION:-0.1.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_ARTIFACT_SIZE_MB: ${MAX_ARTIFACT_SIZE_MB:-200}
      MAX_ARTIFACT_FILES: ${MAX_ARTIFACT_FILES:-20000}
      WORKSPACE_ROOT: /app/workspace
      SBOM_PROVIDER: ${SBOM_PROVIDER:-syft}
      VULN_PROVIDER: ${VULN_PROVIDER:-osv}
      NVD_ENABLED: ${NVD_ENABLED:-true}
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_MAX_LOOKUPS: ${NVD_MAX_LOOKUPS:-10}
      HF_PROVIDER: ${HF_PROVIDER:-hf}
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-30}
      HF_DOWNLOAD_TIMEOUT_SECONDS: ${HF_DOWNLOAD_TIMEOUT_SECONDS:-600}
      HF_MAX_FILE_MB: ${HF_MAX_FILE_MB:-64}
      HF_MAX_FILES: ${HF_MAX_FILES:-2000}
      PICKLE_MAX_MB: ${PICKLE_MAX_MB:-64}
      PICKLE_MAX_OPCODES: ${PICKLE_MAX_OPCODES:-2000000}
      MODEL_CARD_MAX_KB: ${MODEL_CARD_MAX_KB:-256}
      STATIC_MAX_FILES: ${STATIC_MAX_FILES:-5000}
      STATIC_MAX_FILE_KB: ${STATIC_MAX_FILE_KB:-1024}
      STATIC_MAX_TOTAL_MB: ${STATIC_MAX_TOTAL_MB:-64}
      STATIC_MAX_FINDINGS: ${STATIC_MAX_FINDINGS:-500}
      STATIC_ARCHIVE_RATIO_WARN_FRACTION: ${STATIC_ARCHIVE_RATIO_WARN_FRACTION:-0.8}
      # The API container has no Docker socket and never will: "docker" reports "unavailable"
      # here. Real sandbox runs need the API on the host (see README).
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-disabled}
      APP_ENV: ${APP_ENV:-development}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_COMPRESSION_RATIO: ${MAX_COMPRESSION_RATIO:-100.0}
      GIT_CLONE_TIMEOUT_SECONDS: ${GIT_CLONE_TIMEOUT_SECONDS:-120}
      SYFT_PATH: ${SYFT_PATH:-syft}
      SYFT_TIMEOUT_SECONDS: ${SYFT_TIMEOUT_SECONDS:-300}
      MAX_SBOM_MB: ${MAX_SBOM_MB:-50}
      MAX_SBOM_COMPONENTS: ${MAX_SBOM_COMPONENTS:-50000}
      OSV_API_BASE: ${OSV_API_BASE:-https://api.osv.dev}
      OSV_TIMEOUT_SECONDS: ${OSV_TIMEOUT_SECONDS:-20.0}
      OSV_MAX_DETAIL_LOOKUPS: ${OSV_MAX_DETAIL_LOOKUPS:-500}
      NVD_API_BASE: ${NVD_API_BASE:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      NVD_TIMEOUT_SECONDS: ${NVD_TIMEOUT_SECONDS:-20.0}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-2}
      HTTP_MAX_RESPONSE_MB: ${HTTP_MAX_RESPONSE_MB:-10}
      SANDBOX_DOCKER_PATH: ${SANDBOX_DOCKER_PATH:-docker}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-provenancex-sandbox:0.1.0}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-60}
      SANDBOX_HOST_GRACE_SECONDS: ${SANDBOX_HOST_GRACE_SECONDS:-15}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-128}
      SANDBOX_TMP_MB: ${SANDBOX_TMP_MB:-64}
      SANDBOX_TRACE_TMP_MB: ${SANDBOX_TRACE_TMP_MB:-32}
      SANDBOX_MAX_STDERR_KB: ${SANDBOX_MAX_STDERR_KB:-1024}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
      SANDBOX_QUEUE_TIMEOUT_SECONDS: ${SANDBOX_QUEUE_TIMEOUT_SECONDS:-300}
      SANDBOX_MAX_TRACE_MB: ${SANDBOX_MAX_TRACE_MB:-16}
      SANDBOX_MAX_TRACE_LINES: ${SANDBOX_MAX_TRACE_LINES:-200000}
      SANDBOX_SPIKE_MEMORY_FRACTION: ${SANDBOX_SPIKE_MEMORY_FRACTION:-0.9}
      SANDBOX_SPIKE_PIDS_FRACTION: ${SANDBOX_SPIKE_PIDS_FRACTION:-0.9}
      SANDBOX_SPIKE_CPU_FRACTION: ${SANDBOX_SPIKE_CPU_FRACTION:-0.9}
      SANDBOX_SPIKE_CPU_MIN_INTERVALS: ${SANDBOX_SPIKE_CPU_MIN_INTERVALS:-3}
      # Fixed path inside the container: the host's ml/models, mounted read-only.
      MODEL_PATH: /app/ml/models
    volumes:
      - ./ml/models:/app/ml/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
