name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: provenancex
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: provenancex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U provenancex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://provenancex:ci-only-password@localhost:5432/provenancex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Runtime packages from the hash-locked files (audit M6), then the test tools.
      - run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-ml.lock
      - run: pip install -r requirements-dev.txt
      # Pinned, checksum-verified Syft (same version/hash as docker/analyzer/Dockerfile).
      # The real-Syft integration tests need it, and CI fails on any skipped test.
      - name: Install Syft
        env:
          SYFT_VERSION: "1.57.0"
          SYFT_SHA256: "9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704"
        run: |
          set -eu
          tarball="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${tarball}"
          echo "${SYFT_SHA256}  /tmp/${tarball}" | sha256sum -c -
          sudo tar -xzf "/tmp/${tarball}" -C /usr/local/bin syft
          syft version
      - run: ruff check . ../ml/scripts ../scripts --config pyproject.toml && ruff format --check . ../ml/scripts ../scripts --config pyproject.toml
      - run: alembic upgrade head
      # Postgres and Syft are available here, so integration tests must actually run: fail on
      # any skip. Live-internet tests (marker "network") and real-sandbox tests (marker "sandbox")
      # are deselected, not skipped. Run them locally with PROVENANCEX_NETWORK_TESTS=1 and
      # PROVENANCEX_SANDBOX_TESTS=1.
      - name: pytest (no skips allowed)
        run: |
          set -o pipefail
          pytest -q -rs -m "not network and not sandbox and not chain" | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then echo "::error::tests were skipped in CI"; exit 1; fi

  # Audit findings M6 and L11: build every image from its digest-pinned base and hash-locked
  # requirements, then check the built images (no setuid/setgid files, no downloader in the API
  # and runner, a working Docker CLI only in the runner).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every image
        run: |
          set -eu
          make sandbox-images
          docker compose --profile sandbox-image build sandbox-image
          docker compose build api scan-runner egress-proxy hardhat frontend
      - name: Check the built images
        run: |
          set -eu
          for img in provenancex-api provenancex-runner:0.1.0 provenancex-analyzer:0.1.0 \
                     provenancex-fetcher:0.1.0 provenancex-egress-proxy:0.1.0 \
                     provenancex-sandbox:0.1.0 provenancex-frontend provenancex-hardhat:0.1.0; do
            n=$(docker run --rm --entrypoint sh "$img" -c 'find / -xdev -perm /6000 -type f 2>/dev/null | wc -l')
            [ "$n" -eq 0 ] || { echo "::error::$img has $n setuid/setgid files"; exit 1; }
          done
          for img in provenancex-api provenancex-runner:0.1.0; do
            if docker run --rm --entrypoint sh "$img" -c 'command -v curl || command -v wget || command -v gcc'; then
              echo "::error::$img contains a downloader or compiler"; exit 1
            fi
          done
          docker run --rm --entrypoint docker provenancex-runner:0.1.0 --version
          if docker run --rm --entrypoint sh provenancex-api -c 'command -v docker'; then
            echo "::error::the API image has a Docker CLI"; exit 1
          fi

  # Audit finding L11: the real-infrastructure suites. Real Docker sandbox (isolation, tampering,
  # crash and recovery, forged analyzer output), real PostgreSQL (concurrency) and the real
  # Hardhat chain. No internet tests here (marker "network"); run them locally with
  # PROVENANCEX_NETWORK_TESTS=1. Skips fail the job, as in the backend job.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: provenancex
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: provenancex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U provenancex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://provenancex:ci-only-password@localhost:5432/provenancex
      PROVENANCEX_SANDBOX_TESTS: "1"
      PROVENANCEX_CHAIN_TESTS: "1"
      BLOCKCHAIN_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r requirements.lock -r requirements-ml.lock
      - run: pip install -r requirements-dev.txt
      - name: Build the sandbox images and the chain
        working-directory: .
        run: |
          set -eu
          make sandbox-images
          docker compose --profile sandbox-image build sandbox-image
          docker compose build egress-proxy hardhat
      - name: Start Hardhat and deploy the contract (local dev key only)
        working-directory: .
        run: |
          set -eu
          docker compose up -d --wait hardhat
          key=$(docker compose logs --no-log-prefix hardhat | awk '/Private Key:/ && !k { k = $3 } END { print k }')
          echo "::add-mask::$key"
          out=$(BLOCKCHAIN_PRIVATE_KEY="$key" docker compose --profile chain-deploy run --rm -T hardhat-deploy)
          addr=$(sed -n 's/.*"contract_address":"\(0x[0-9a-fA-F]\{40\}\)".*/\1/p' <<<"$out")
          [ -n "$addr" ] || { echo "::error::contract not deployed"; exit 1; }
          echo "BLOCKCHAIN_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo "BLOCKCHAIN_CONTRACT_ADDRESS=$addr" >> "$GITHUB_ENV"
      - run: alembic upgrade head
      - name: pytest live suites (no skips allowed)
        run: |
          set -o pipefail
          pytest -q -rs -m "(sandbox or chain or integration) and not network" | tee live.out
          if grep -qE '[0-9]+ skipped' live.out; then echo "::error::live tests were skipped"; exit 1; fi

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx hardhat test
      - run: node scripts/check-abi.js ../backend/app/blockchain/abi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest --run
      - run: npm run build
