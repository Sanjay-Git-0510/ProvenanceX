name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: provenancex
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: provenancex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U provenancex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://provenancex:ci-only-password@localhost:5432/provenancex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Pinned, checksum-verified Syft (same version/hash as backend/Dockerfile).
      # The real-Syft integration tests need it, and CI fails on any skipped test.
      - name: Install Syft
        env:
          SYFT_VERSION: "1.57.0"
          SYFT_SHA256: "9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704"
        run: |
          set -eu
          tarball="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${tarball}"
          echo "${SYFT_SHA256}  /tmp/${tarball}" | sha256sum -c -
          sudo tar -xzf "/tmp/${tarball}" -C /usr/local/bin syft
          syft version
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head
      # Postgres and Syft are available here, so integration tests must actually run: fail on
      # any skip. Live-internet tests (marker "network") and real-sandbox tests (marker "sandbox")
      # are deselected, not skipped. Run them locally with PROVENANCEX_NETWORK_TESTS=1 and
      # PROVENANCEX_SANDBOX_TESTS=1.
      - name: pytest (no skips allowed)
        run: |
          set -o pipefail
          pytest -q -rs -m "not network and not sandbox" | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then echo "::error::tests were skipped in CI"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest --run
      - run: npm run build
